<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Updated Web Page</title>
    <style>
        /* Base Styles */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Navigation Bar */
        nav {
            background-color: #333;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* Dark Mode Button */
        .toggle-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .toggle-btn:hover {
            background-color: #777;
        }

        /* Main Layout */
        header {
            background-color: #f4f4f4;
            padding: 2rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            background-color: #121212;
            color: #f4f4f4;
        }
        body.dark-mode header {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </nav>

    <!-- Header Section -->
    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <!-- Main Content Area -->
    <main>
        <section>
            <h2>About This Page</h2>
            <p>This is a paragraph of text on my new updated HTML page. It now features modern layouts, embedded CSS styling, and JavaScript interactivity.</p>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Web Page</p>
    </footer>

    <!-- JavaScript Interactivity -->
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>

</body>
</html>
